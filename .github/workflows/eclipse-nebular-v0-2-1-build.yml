name: Eclipse Nebular Aurora v0.2.1 Cloud Refinement Build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate, extract, and repair v0.2.1 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 4 -type f -name 'Eclipse_Nebular_Aurora_v0_2_1_CloudRefinement.zip' -print -quit)
          test -n "$ZIP"
          unzip -q "$ZIP" -d extracted
          BUILD_DIR=$(find extracted -type f -name build.sh -printf '%h\n' -quit)
          test -n "$BUILD_DIR"

          # ZIP archives do not reliably preserve symlinks on every mobile workflow.
          # Restore relative-path placeholders used by Newb materials before compiling.
          python - "$BUILD_DIR" <<'PY'
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          restored = 0
          candidates = {"material.json", "uniforms"}

          for current, dirs, files in os.walk(root, topdown=True, followlinks=False):
              for name in candidates.intersection(files):
                  item = Path(current) / name
                  if item.is_symlink():
                      continue
                  try:
                      value = item.read_text(encoding="utf-8").strip()
                  except (OSError, UnicodeError):
                      continue

                  if not value.startswith("../") and not value.startswith("./"):
                      continue
                  target = (item.parent / value).resolve()
                  try:
                      target.relative_to(root)
                  except ValueError:
                      continue
                  if not target.exists():
                      continue

                  item.unlink()
                  item.symlink_to(value)
                  print(f"Restored symlink: {item.relative_to(root)} -> {value}")
                  restored += 1

          print(f"Symlink placeholders restored: {restored}")
          PY

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and build Android
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          chmod +x ./build.sh
          python -m pip install -r requirements.txt
          ./build.sh setup
          ./build.sh mats -p android
          ./build.sh pack -p android -v 2

      - name: Upload v0.2.1 cloud refinement artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eclipse-Nebular-Aurora-v0.2.1-CloudRefinement
          path: ${{ env.BUILD_DIR }}/build/*.mcpack
          if-no-files-found: error
